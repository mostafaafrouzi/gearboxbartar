<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ED145B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="دفتر مالی داخلی تعمیرگاه گیربکس اتوماتیک برتر">
<title>دفتر مالی | گیربکس اتوماتیک برتر</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png" sizes="39x39">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/fonts/iransansx/fonts.css">
<style>
  :root {
    --bg: #F7F8FC;
    --card-bg: #FFFFFF;
    --green-primary: #03324D;
    --green-light: #0A4D73;
    --green-soft: #E8F0F6;
    --green-subtle: #D3E3EE;
    --gold-accent: #ED145B;
    --gold-soft: #FDE8F0;
    --ink: #1E2228;
    --ink-soft: #5C6570;
    --border: #E5E8EF;
    --red-danger: #C0392B;
    --red-soft: #FDEDEC;
    --blue-accent: #2980B9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: IRANSansX, Tahoma, sans-serif;
    font-size: 13.5px;
    line-height: 1.6;
    padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    touch-action: pan-y;
  }
  header {
    padding: 10px 14px 12px;
    background: var(--bg);
    color: var(--ink);
    border-bottom: 3px solid var(--gold-accent);
    box-shadow: 0 2px 10px rgba(3, 50, 77, 0.08);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 760px;
    margin: 0 auto;
  }
  .brand-link { display: block; flex-shrink: 0; line-height: 0; }
  .site-logo {
    display: block;
    max-height: 52px;
    width: auto;
    max-width: min(58vw, 210px);
    height: auto;
  }
  .header-meta { text-align: left; min-width: 0; }
  header .app-tag {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--green-primary);
  }
  header .brand-sub {
    margin: 2px 0 0;
    font-size: 10.5px;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  header #todayLabel {
    margin: 6px 0 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold-accent);
  }
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 200;
    display: flex;
    justify-content: space-around;
    align-items: stretch;
    gap: 2px;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: #fff;
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(20,40,75,0.08);
    max-width: 760px;
    margin: 0 auto;
  }
  .bottom-nav button {
    flex: 1;
    background: none;
    border: none;
    padding: 8px 4px;
    font-family: inherit;
    font-size: 10.5px;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 8px;
    line-height: 1.3;
    min-height: 48px;
    transition: 0.15s;
  }
  .bottom-nav button .nav-icon { display: block; font-size: 18px; margin-bottom: 2px; }
  .bottom-nav button.active {
    background: var(--green-soft);
    color: var(--green-primary);
    font-weight: 700;
  }
  .quick-actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .quick-actions .btn { flex: 1; min-height: 48px; font-size: 13.5px; }
  .btn-income { background: #1E8449; color: #fff; }
  .btn-expense { background: var(--red-danger); color: #fff; }
  .btn-lg { min-height: 48px; padding: 12px 14px; font-size: 14px; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  .table-scroll .tx-table { min-width: 520px; }
  .info-banner {
    background: var(--gold-soft);
    border: 1px solid var(--gold-accent);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: #5C4A1A;
    margin-bottom: 12px;
    line-height: 1.55;
  }
  .more-menu-btn {
    width: 100%;
    text-align: right;
    padding: 14px 12px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #FAFBFE;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  .more-menu-btn:active { background: var(--green-soft); }
  .sms-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .sms-tabs button {
    flex: 1;
    min-width: 90px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .sms-tabs button.active { background: var(--green-soft); border-color: var(--green-primary); font-weight: 700; color: var(--green-primary); }
  .sms-queue-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    background: #FAFBFE;
  }
  .sms-queue-card textarea {
    min-height: 88px;
    font-size: 12.5px;
    margin-bottom: 8px;
  }
  .sms-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  #toast {
    position: fixed;
    bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 12.5px;
    z-index: 3000;
    max-width: min(92vw, 400px);
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #toast.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  #toast button {
    background: var(--gold-accent);
    border: none;
    color: #fff;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    font-size: 12px;
  }
  main { padding: 12px; max-width: 760px; margin: auto; min-height: 80vh; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(20,40,75,0.04);
  }
  .card h2 {
    font-size: 14px;
    margin: 0 0 12px;
    font-weight: 700;
    color: var(--green-primary);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat {
    background: #FAFBFE;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    cursor: default;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .stat.clickable { cursor: pointer; }
  .stat.clickable:active { transform: scale(0.98); background: var(--green-soft); }
  .stat .label { font-size: 11.5px; color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; }
  .stat .value { font-size: 15px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat.primary { border-color: var(--green-light); background: var(--green-soft); }
  .stat.primary .value { color: var(--green-primary); }
  .stat.good { border-color: #27AE60; background: #EAF9EE; }
  .stat.good .value { color: #1E8449; }
  .stat.danger { border-color: var(--red-danger); background: var(--red-soft); }
  .stat.danger .value { color: var(--red-danger); }
  .stat.gold { border-color: var(--gold-accent); background: var(--gold-soft); }
  .stat.gold .value { color: #8C6A1D; }

  label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
  input, select, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 13.5px;
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    margin-bottom: 10px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--green-primary); box-shadow: 0 0 0 2px rgba(20,40,75,0.1); }
  .money-input { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: 0.3px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .type-btns { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .type-btns button {
    flex: 1;
    min-width: 60px;
    padding: 8px 4px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .type-btns button.active {
    background: var(--green-primary);
    border-color: var(--green-primary);
    color: #fff;
    font-weight: 700;
  }
  .btn {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .btn-primary { background: var(--green-primary); color: #fff; width: 100%; min-height: 48px; }
  .btn-dark { background: var(--green-light); color: #fff; width: 100%; }
  .btn-gold { background: var(--gold-accent); color: #fff; }
  .btn-excel { background: #1D6F42; color: #fff; }
  .btn-sm { padding: 4px 8px; font-size: 11px; font-weight: 600; }
  .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--ink-soft); }

  .tx-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .tx-table th, .tx-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: right; }
  .tx-table th { background: var(--green-soft); color: var(--green-primary); font-weight: 700; }

  .tx-item {
    border-bottom: 1px solid var(--border);
    padding: 10px 2px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .tx-item:last-child { border-bottom: none; }
  .tx-main { flex: 1; }
  .tx-cat { font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .tx-meta { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .tx-amount { font-weight: 800; white-space: nowrap; font-size: 14px; }
  .tx-amount.income { color: #1E8449; }
  .tx-amount.expense { color: var(--red-danger); }
  .tx-amount.withdrawal { color: #D35400; }
  .tx-amount.transfer { color: var(--blue-accent); }

  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  .tag.unpaid { border-color: var(--red-danger); color: var(--red-danger); background: var(--red-soft); }
  .tag.paid { border-color: #27AE60; color: #1E8449; background: #EAF9EE; }
  .tag.split { border-color: var(--gold-accent); color: #8C6A1D; background: var(--gold-soft); }
  .empty { color: var(--ink-soft); font-size: 12px; text-align: center; padding: 18px 0; }

  .person-box {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: #fff;
  }
  .person-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--green-soft);
    padding-bottom: 6px;
  }
  .person-title { font-weight: 700; font-size: 14px; }
  .day-folder {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #FAFBFE;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .day-folder:hover { background: var(--green-soft); }

  /* Modal Styles */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(20, 40, 75, 0.6);
    backdrop-filter: blur(3px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .modal-content {
    background: #fff;
    border-radius: 12px;
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    border-top: 4px solid var(--green-primary);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .modal-header h3 { margin: 0; font-size: 15px; color: var(--green-primary); }
  .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink-soft); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand-link" href="https://www.gearboxbartar.com/" target="_blank" rel="noopener noreferrer" title="سایت گیربکس اتوماتیک برتر">
      <img class="site-logo" src="icons/logo-top.png" width="210" height="52" alt="مجموعه گیربکس اتوماتیک برتر">
    </a>
    <div class="header-meta">
      <p class="app-tag">دفتر مالی داخلی</p>
      <p class="brand-sub">داده روی این دستگاه ذخیره می‌شود</p>
      <p id="todayLabel"></p>
    </div>
  </div>
</header>

<main id="main"></main>

<nav id="bottomNav" class="bottom-nav" aria-label="منوی اصلی">
  <button type="button" data-tab="dashboard" class="active"><span class="nav-icon">📊</span>داشبورد</button>
  <button type="button" data-tab="new"><span class="nav-icon">✏️</span>ثبت سند</button>
  <button type="button" data-tab="list"><span class="nav-icon">📒</span>دفتر امروز</button>
  <button type="button" data-tab="jobs"><span class="nav-icon">🚗</span>خودروها</button>
  <button type="button" data-tab="more"><span class="nav-icon">☰</span>بیشتر</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modalContainer" style="display:none;"></div>

<script>
var memStore = {};
function safeStorageGet(key) {
  try { return localStorage.getItem(key); } catch(e) { return memStore[key] || null; }
}
function safeStorageSet(key, val) {
  try { localStorage.setItem(key, val); } catch(e) { memStore[key] = val; }
}

var DB_VERSION = 16;
var STORAGE_KEY = 'tamirgah_db_v15_gearboxbartar';
var BACKUP_META_KEY = 'tamirgah_last_backup_iso';
var REMINDER_KEY = 'tamirgah_backup_reminder';
var TAB_ORDER = ['dashboard','new','list','jobs','more'];
var SECONDARY_TABS = ['accounts','inventory','persons','pnl','sms','backup'];
var transactions = [];
var jobs = [];
var inventory = [];
var accounts = [
  { id: 'acc_cash', name: 'صندوق نقد فیزیکی (دخل)', initial: 0 },
  { id: 'acc_pos1', name: 'کارت‌خوان اصلی', initial: 0 }
];
var activeTab = 'dashboard';
var journalSearchQuery = '';
var lastUndoDelete = null;
var undoDeleteTimer = null;
var showBackupJsonPreview = false;
var toastHideTimer = null;
var smsQueue = [];
var smsLog = [];
var smsUiView = 'queue';

var DEFAULT_IPPANEL_SETTINGS = {
  enabled: true,
  apiKey: '',
  fromNumber: '',
  apiBase: 'https://edge.ippanel.com/v1',
  shopName: 'گیربکس اتوماتیک برتر',
  shopPhone: '02100000000',
  daysAfterDelivery: 90,
  kmInterval: 5000,
  minDaysBetweenSamePhone: 60,
  maxPerPhonePerYear: 3,
  sendHourFrom: 9,
  sendHourTo: 20,
  messageTemplate:
    '{سلام} {نام} عزیز،\n' +
    'خودرو {مدل} ({پلاک}) در تاریخ {تاریخ_ترخیص} در {نام_تعمیرگاه} تعمیر/سرویس شد.\n' +
    'یادآوری دوستانه: حدود {کیلومتر_سرویس_بعدی} کیلومتر (یا {روز_بعد} روز پس از ترخیص) برای تعویض روغن و سرویس دوره‌ای گیربکس سراغ ما بیا.\n' +
    'تماس: {تلفن_تعمیرگاه}\n' +
    '— {نام_تعمیرگاه}'
};
var ippanelSettings = JSON.parse(JSON.stringify(DEFAULT_IPPANEL_SETTINGS));

function esc(s){
  if(s === undefined || s === null) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }

function hideToast(){
  clearTimeout(toastHideTimer);
  toastHideTimer = null;
  var el = document.getElementById('toast');
  if(!el) return;
  el.classList.remove('show');
  el.setAttribute('aria-hidden', 'true');
}

function showToast(message, undoFn){
  var el = document.getElementById('toast');
  if(!el) return;
  hideToast();
  el.innerHTML = '';
  var span = document.createElement('span');
  span.textContent = message;
  el.appendChild(span);
  if(undoFn){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'بازگردانی';
    btn.onclick = function(e){
      e.stopPropagation();
      undoFn();
      hideToast();
    };
    el.appendChild(btn);
  }
  el.setAttribute('aria-hidden', 'false');
  el.classList.add('show');
  el.onclick = function(){
    if(!undoFn) hideToast();
  };
  var duration = undoFn ? 8000 : 3500;
  toastHideTimer = setTimeout(hideToast, duration);
}

function isSecondaryTab(tab){
  return SECONDARY_TABS.indexOf(tab) >= 0;
}

function markBackupDone(){
  safeStorageSet(BACKUP_META_KEY, new Date().toISOString());
}

function stringifyBackupPayload(){
  try {
    return JSON.stringify(buildExportPayload(), null, 2);
  } catch(err){
    var slim = buildExportPayload();
    slim.smsQueue = (smsQueue || []).map(function(q){
      return {
        id: q.id, campaignId: q.campaignId, jobId: q.jobId, status: q.status,
        createdAt: q.createdAt, phone: q.phone, customerName: q.customerName,
        plate: q.plate, reason: q.reason, message: q.message, sentAt: q.sentAt, lastError: q.lastError
      };
    });
    slim.smsLog = (smsLog || []).slice(-100);
    return JSON.stringify(slim, null, 2);
  }
}

function getBackupFilename(){
  return 'gearboxbartar-backup-' + todayStr() + '.json';
}

function downloadBackupFile(dataStr, filename){
  filename = filename || getBackupFilename();
  var blob = new Blob(['\uFEFF' + dataStr], { type: 'application/json;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    try { document.body.removeChild(a); } catch(e){}
    URL.revokeObjectURL(url);
  }, 500);
}

function runBackupExport(opts){
  opts = opts || {};
  var dataStr = stringifyBackupPayload();
  var filename = getBackupFilename();
  markBackupDone();
  downloadBackupFile(dataStr, filename);
  if(opts.tryShare){
    try {
      var file = new File([dataStr], filename, { type: 'application/json' });
      if(navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))){
        navigator.share({
          title: 'پشتیبان حسابداری گیربکس برتر',
          text: 'فایل پشتیبان مورخ ' + faDate(todayStr()),
          files: [file]
        }).catch(function(){});
      }
    } catch(e){}
  }
  return dataStr;
}

function getLastBackupLabel(){
  var iso = safeStorageGet(BACKUP_META_KEY);
  if(!iso) return 'هنوز پشتیبان گرفته نشده';
  try {
    var d = iso.slice(0, 10);
    return 'آخرین پشتیبان: ' + faDate(d) + ' (' + iso.slice(11, 16) + ')';
  } catch(e){ return 'آخرین پشتیبان ثبت شد'; }
}

function buildExportPayload(){
  return {
    version: DB_VERSION,
    exportedAt: new Date().toISOString(),
    transactions: transactions,
    jobs: jobs,
    inventory: inventory,
    accounts: accounts,
    ippanelSettings: ippanelSettings,
    smsQueue: smsQueue,
    smsLog: smsLog
  };
}

function mergeIppanelSettings(raw){
  var base = JSON.parse(JSON.stringify(DEFAULT_IPPANEL_SETTINGS));
  if(!raw || typeof raw !== 'object') return base;
  Object.keys(base).forEach(function(k){
    if(raw[k] !== undefined && raw[k] !== null) base[k] = raw[k];
  });
  return base;
}

function applyImportData(d){
  transactions = d.transactions || [];
  jobs = (d.jobs || []).map(normalizeJobRecord);
  inventory = d.inventory || [];
  accounts = d.accounts && d.accounts.length > 0 ? d.accounts : accounts;
  ippanelSettings = mergeIppanelSettings(d.ippanelSettings);
  smsQueue = d.smsQueue || [];
  smsLog = d.smsLog || [];
}

function normalizeJobRecord(j){
  j = j || {};
  if(!j.smsCampaigns) j.smsCampaigns = {};
  if(j.smsOptOut === undefined) j.smsOptOut = false;
  if(!j.customerPhone) j.customerPhone = '';
  if(j.status === 'done' && !j.deliveredDate) j.deliveredDate = j.createdDate || todayStr();
  if(j.status === 'done' && !j.deliveryKm && j.km) j.deliveryKm = j.km;
  return j;
}

function daysBetweenIso(isoFrom, isoTo){
  var a = new Date((isoFrom||todayStr()) + 'T12:00:00');
  var b = new Date((isoTo||todayStr()) + 'T12:00:00');
  return Math.max(0, Math.floor((b - a) / 86400000));
}

function parseKmValue(v){
  var n = parseInt(String(v || '').replace(/[^0-9]/g, ''), 10);
  return isNaN(n) ? 0 : n;
}

function normalizeIranPhone(raw){
  var s = String(raw || '').trim().replace(/[۰-۹]/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })
    .replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
    .replace(/[\s\-()]/g, '');
  if(!s) return '';
  if(s.indexOf('+98') === 0) return s;
  if(s.indexOf('0098') === 0) return '+98' + s.slice(4);
  if(s.indexOf('98') === 0 && s.length >= 12) return '+' + s;
  if(s.indexOf('09') === 0 && s.length === 11) return '+98' + s.slice(1);
  if(s.indexOf('9') === 0 && s.length === 10) return '+98' + s;
  if(s.indexOf('0') === 0) return '+98' + s.slice(1);
  return s.length >= 10 ? '+98' + s : '';
}

function renderSmsTemplate(template, job){
  var settings = ippanelSettings;
  var del = job.deliveredDate || job.createdDate || todayStr();
  var km0 = parseKmValue(job.deliveryKm || job.km);
  var kmNext = km0 > 0 ? km0 + (settings.kmInterval || 5000) : (settings.kmInterval || 5000);
  var replacements = {
    '{سلام}': 'سلام',
    '{نام}': job.customer || 'مشتری',
    '{پلاک}': job.plate || '—',
    '{مدل}': job.carModel || '',
    '{تاریخ_پذیرش}': faDate(job.createdDate),
    '{تاریخ_ترخیص}': faDate(del),
    '{نام_تعمیرگاه}': settings.shopName || 'تعمیرگاه',
    '{کیلومتر_فعلی}': km0 ? faDigits(km0) : '—',
    '{کیلومتر_سرویس_بعدی}': faDigits(kmNext),
    '{روز_بعد}': faDigits(settings.daysAfterDelivery || 90),
    '{تلفن_تعمیرگاه}': settings.shopPhone || ''
  };
  var msg = template || DEFAULT_IPPANEL_SETTINGS.messageTemplate;
  Object.keys(replacements).forEach(function(k){ msg = msg.split(k).join(replacements[k]); });
  return msg.trim();
}

function jobCampaignDone(job, campaignId){
  return job.smsCampaigns && job.smsCampaigns[campaignId];
}

function hasRecentSmsToPhone(phone, minDays){
  if(!phone) return false;
  var today = todayStr();
  for(var i = smsLog.length - 1; i >= 0; i--){
    var L = smsLog[i];
    if(L.phone !== phone || L.status !== 'sent' || !L.sentAt) continue;
    if(daysBetweenIso(L.sentAt.slice(0, 10), today) < minDays) return true;
  }
  return false;
}

function countSmsToPhoneThisYear(phone){
  var y = String(new Date().getFullYear());
  var n = 0;
  smsLog.forEach(function(L){
    if(L.phone === phone && L.status === 'sent' && L.sentAt && String(L.sentAt).slice(0, 4) === y) n++;
  });
  return n;
}

function isSmsQuietHoursNow(){
  var h = new Date().getHours();
  var from = Number(ippanelSettings.sendHourFrom) || 9;
  var to = Number(ippanelSettings.sendHourTo) || 20;
  return h < from || h >= to;
}

function refreshSmsQueueSuggestions(){
  if(!ippanelSettings.enabled) return 0;
  var settings = ippanelSettings;
  var today = todayStr();
  var added = 0;
  var campaignId = 'service_reminder';

  jobs.forEach(function(job){
    job = normalizeJobRecord(job);
    if(job.status !== 'done' || job.smsOptOut) return;
    if(!job.deliveredDate) return;
    if(daysBetweenIso(job.deliveredDate, today) < (settings.daysAfterDelivery || 90)) return;
    if(jobCampaignDone(job, campaignId)) return;

    var phone = normalizeIranPhone(job.customerPhone);
    if(!phone || phone.length < 12) return;

    var dupPending = smsQueue.some(function(q){
      return q.jobId === job.id && q.campaignId === campaignId && q.status === 'pending';
    });
    if(dupPending) return;

    if(hasRecentSmsToPhone(phone, settings.minDaysBetweenSamePhone || 60)) return;
    if(countSmsToPhoneThisYear(phone) >= (settings.maxPerPhonePerYear || 3)) return;

    smsQueue.push({
      id: 'smsq_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      campaignId: campaignId,
      jobId: job.id,
      status: 'pending',
      createdAt: new Date().toISOString(),
      phone: phone,
      customerName: job.customer || '',
      plate: job.plate || '',
      reason: daysBetweenIso(job.deliveredDate, today) + ' روز از ترخیص — یادآوری سرویس ~' + faDigits(settings.kmInterval || 5000) + ' کیلومتر',
      message: renderSmsTemplate(settings.messageTemplate, job)
    });
    added++;
  });
  if(added) saveData();
  return added;
}

function sendIppanelSms(phone, message){
  var s = ippanelSettings;
  if(!s.apiKey || !s.fromNumber){
    return Promise.reject(new Error('کلید API یا شماره ارسال‌کننده تنظیم نشده است.'));
  }
  var url = String(s.apiBase || 'https://edge.ippanel.com/v1').replace(/\/$/, '') + '/api/send';
  return fetch(url, {
    method: 'POST',
    headers: {
      'Authorization': s.apiKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      sending_type: 'webservice',
      from_number: s.fromNumber,
      message: message,
      params: { recipients: [phone] }
    })
  }).then(function(res){
    return res.json().then(function(data){
      if(!res.ok || (data.meta && data.meta.status === false)){
        var errMsg = (data.meta && data.meta.message) ? data.meta.message : ('HTTP ' + res.status);
        throw new Error(errMsg);
      }
      return data;
    });
  });
}

function approveAndSendSmsQueueItem(queueId){
  var item = smsQueue.find(function(q){ return q.id === queueId; });
  if(!item || item.status !== 'pending') return;
  var ta = document.querySelector('textarea[data-sms-msg="' + queueId + '"]');
  if(ta) item.message = ta.value.trim();

  if(isSmsQuietHoursNow()){
    if(!confirm('الان خارج از بازهٔ مجاز ارسال (ساعات شلوغی/شب) است. باز هم ارسال شود؟')) return;
  }
  if(!confirm('پیامک به ' + item.phone + ' ارسال شود؟\n\n' + item.message.slice(0, 120) + '...')) return;

  item.status = 'sending';
  render();

  sendIppanelSms(item.phone, item.message).then(function(apiRes){
    item.status = 'sent';
    item.sentAt = new Date().toISOString();
    item.apiResponse = apiRes && apiRes.data ? apiRes.data : apiRes;
    var job = jobs.find(function(j){ return j.id === item.jobId; });
    if(job){
      if(!job.smsCampaigns) job.smsCampaigns = {};
      job.smsCampaigns[item.campaignId] = { status: 'sent', at: item.sentAt };
    }
    smsLog.push({
      id: 'smslog_' + Date.now(),
      queueId: item.id,
      jobId: item.jobId,
      phone: item.phone,
      message: item.message,
      status: 'sent',
      sentAt: item.sentAt,
      campaignId: item.campaignId
    });
    smsQueue = smsQueue.filter(function(q){ return q.id !== item.id; });
    saveData();
    showToast('پیامک با موفقیت ارسال شد.');
    render();
  }).catch(function(err){
    item.status = 'pending';
    item.lastError = String(err.message || err);
    smsLog.push({
      id: 'smslog_' + Date.now(),
      queueId: item.id,
      jobId: item.jobId,
      phone: item.phone,
      message: item.message,
      status: 'failed',
      sentAt: new Date().toISOString(),
      error: item.lastError,
      campaignId: item.campaignId
    });
    saveData();
    alert('ارسال ناموفق: ' + item.lastError + '\n\nاگر خطای CORS دیدید، از مرورگر دیگر استفاده کنید یا ارسال را از پنل آی‌پی‌پنل انجام دهید و دکمه «ثبت دستی ارسال» را بزنید.');
    render();
  });
}

function dismissSmsQueueItem(queueId, reason){
  var item = smsQueue.find(function(q){ return q.id === queueId; });
  if(!item) return;
  var job = jobs.find(function(j){ return j.id === item.jobId; });
  if(job){
    if(!job.smsCampaigns) job.smsCampaigns = {};
    job.smsCampaigns[item.campaignId] = { status: 'dismissed', at: new Date().toISOString(), reason: reason || '' };
  }
  smsLog.push({
    id: 'smslog_' + Date.now(),
    queueId: item.id,
    jobId: item.jobId,
    phone: item.phone,
    message: item.message,
    status: 'dismissed',
    sentAt: new Date().toISOString(),
    campaignId: item.campaignId,
    note: reason || ''
  });
  smsQueue = smsQueue.filter(function(q){ return q.id !== queueId; });
  saveData();
  showToast('پیام از صف حذف شد (بدون ارسال).');
  render();
}

function markSmsQueueItemSentManually(queueId){

function exportToExcelCSV(filename, rowsArray){
  var csvContent = '\uFEFF';
  rowsArray.forEach(function(row){
    var escapedRow = row.map(function(field){
      var str = String(field === undefined || field === null ? '' : field);
      return '"' + str.replace(/"/g, '""') + '"';
    });
    csvContent += escapedRow.join(',') + '\r\n';
  });

  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function jDiv(a,b){ return ~~(a/b); }
function jMod(a,b){ return a-~~(a/b)*b; }
function jalCal(jy){
  var breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl = breaks.length;
  var leapJ=-14, jp=breaks[0], jump=0;
  for(var i=1; i<bl; i+=1){
    var jm=breaks[i]; jump=jm-jp;
    if(jy<jm) break;
    leapJ = leapJ + jDiv(jump,33)*8 + jDiv(jMod(jump,33),4);
    jp=jm;
  }
  var n = jy-jp;
  leapJ = leapJ + jDiv(n,33)*8 + jDiv(jMod(n,33)+3,4);
  if(jMod(jump,33)===4 && jump-n===4) leapJ+=1;
  var leapG = jDiv(jy+621,4) - jDiv((jDiv(jy+621,100)+1)*3,4) - 150;
  return { leap: jMod(jMod(n+1,33)-1,4)===-1 ? 4 : jMod(jMod(n+1,33)-1,4), gy: jy+621, march: 20+leapJ-leapG };
}
function g2d(gy,gm,gd){
  var d = jDiv((gy+jDiv(gm-8,6)+100100)*1461,4) + jDiv(153*jMod(gm+9,12)+2,5) + gd - 34840408;
  return d - jDiv(jDiv(gy+100100+jDiv(gm-8,6),100)*3,4) + 752;
}
function d2g(jdn){
  var j = 4*jdn + 139361631 + jDiv(jDiv(4*jdn+183187720,146097)*3,4)*4 - 3908;
  var i = jDiv(jMod(j,1461),4)*5 + 308;
  return { gy: jDiv(j,1461) - 100100 + jDiv(8-(jMod(jDiv(i,153),12)+1),6), gm: jMod(jDiv(i,153),12)+1, gd: jDiv(jMod(i,153),5)+1 };
}
function j2d(jy,jm,jd){
  var r = jalCal(jy);
  return g2d(r.gy,3,r.march) + (jm-1)*31 - jDiv(jm,7)*(jm-7) + jd - 1;
}
function d2j(jdn){
  var gy = d2g(jdn).gy; var jy = gy-621; var r = jalCal(jy); var jdn1f = g2d(r.gy,3,r.march); var k = jdn-jdn1f;
  if(k>=0){ if(k<=185) return [jy, 1+jDiv(k,31), jMod(k,31)+1]; k-=186; }
  else { jy-=1; k+=179; if(r.leap===1) k+=1; }
  return [jy, 7+jDiv(k,30), jMod(k,30)+1];
}
function gregorianToJalali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function jalaliToGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }
function isLeapJalali(jy){ return jalCal(jy).leap===1; }
function jalaaliMonthLength(jy,jm){
  if(jm<=6) return 31;
  if(jm<=11) return 30;
  return isLeapJalali(jy) ? 30 : 29;
}
function isoToJalali(iso){
  var d = new Date(iso+'T00:00:00');
  return gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
}
function jalaliToISO(jy,jm,jd){
  var g = jalaliToGregorian(jy,jm,jd);
  return g.gy+'-'+String(g.gm).padStart(2,'0')+'-'+String(g.gd).padStart(2,'0');
}
function todayStr(){
  var d = new Date();

}
function faDate(d){
  if(!d) return '';

}
var JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jalaliDateField(name, isoDefault){
  var p = isoToJalali(isoDefault || todayStr());
  var jy = p[0], jm = p[1], jd = p[2];
  var curJy = isoToJalali(todayStr())[0];
  var dim = jalaaliMonthLength(jy,jm);

  for(var d=1; d<=dim; d++) dayOpts += '<option value="'+d+'" '+(d===jd?'selected':'')+'>'+faDigits(d)+'</option>';
  JALALI_MONTHS.forEach(function(mn,idx){
    var mv=idx+1; monthOpts += '<option value="'+mv+'" '+(mv===jm?'selected':'')+'>'+mn+'</option>';

function getUniquePersonNames(){
  var set = {};
  transactions.forEach(function(t){ if(t.person && t.person.trim()) set[t.person.trim()] = true; });
  jobs.forEach(function(j){ if(j.customer && j.customer.trim()) set[j.customer.trim()] = true; });
  return Object.keys(set).sort(function(a, b){ return a.localeCompare(b, 'fa'); });
}

function computeAccountBalances(){
  var map = {};
  accounts.forEach(function(a){ map[a.id] = Number(a.initial) || 0; });
  transactions.forEach(function(t){
    var accId = t.accountId;
    var totalAmt = Number(t.amount) || 0;
    var cashPortion = (t.paymentStatus === 'split') ? (Number(t.paidAmount) || 0) : ((t.paymentStatus === 'credit') ? 0 : totalAmt);

    if(!accId || map[accId] === undefined || cashPortion <= 0) return;

    if(t.type === 'income' || t.type === 'settle_receipt' || t.type === 'transfer_in' || t.type === 'loan_taken'){
      map[accId] += cashPortion;
    } else if(t.type === 'expense' || t.type === 'inventory_purchase' || t.type === 'withdrawal' || t.type === 'settle_payment' || t.type === 'transfer_out' || t.type === 'loan_given'){
      map[accId] -= cashPortion;
    }
  });
  return map;
}

function getAccountStatement(accId){
  var acc = accounts.find(function(a){ return a.id === accId; });
  if(!acc) return { account: null, entries: [], totalIn: 0, totalOut: 0, finalBalance: 0 };

  var running = Number(acc.initial) || 0;
  var totalIn = 0, totalOut = 0;
  var entries = [];

  var txList = transactions.filter(function(t){ return t.accountId === accId; })
                          .sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });

  txList.forEach(function(t){
    var totalAmt = Number(t.amount) || 0;
    var cash = (t.paymentStatus === 'split') ? (Number(t.paidAmount) || 0) : ((t.paymentStatus === 'credit') ? 0 : totalAmt);
    if(cash <= 0) return;

    var inc = 0, exp = 0;
    if(t.type === 'income' || t.type === 'settle_receipt' || t.type === 'transfer_in' || t.type === 'loan_taken'){
      inc = cash;
      totalIn += inc;
      running += inc;
    } else if(t.type === 'expense' || t.type === 'inventory_purchase' || t.type === 'withdrawal' || t.type === 'settle_payment' || t.type === 'transfer_out' || t.type === 'loan_given'){
      exp = cash;
      totalOut += exp;
      running -= exp;
    }

    entries.push({
      date: t.date,
      title: t.category + (t.note ? ' (' + t.note + ')' : ''),
      person: t.person || '-',
      income: inc,
      expense: exp,
      balance: running,
      typeTitle: TYPE_LABELS[t.type] || t.type
    });
  });

  return { account: acc, entries: entries, totalIn: totalIn, totalOut: totalOut, finalBalance: running };
}

function computeTotals(list){
  var income = 0, expense = 0, withdrawal = 0;
  list.forEach(function(t){
    var amt = Number(t.amount) || 0;
    if(t.type === 'income') income += amt;
    else if(t.type === 'expense' || t.type === 'inventory_usage') expense += amt;
    else if(t.type === 'withdrawal') withdrawal += amt;
  });
  var netProfit = income - expense;
  return { income: income, expense: expense, withdrawal: withdrawal, netProfit: netProfit };
}

function getPersonLedger(personName){
  var pName = (personName || '').trim();
  var entries = [];
  var runningBalance = 0;

  var userTx = transactions.filter(function(t){
    return (t.person || '').trim() === pName;
  }).sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });

  userTx.forEach(function(t){
    var amt = Number(t.amount) || 0;
    var debit = 0, credit = 0;
    var cashPaid = (t.paymentStatus === 'split') ? (Number(t.paidAmount)||0) : ((t.paymentStatus === 'credit') ? 0 : amt);

    if(t.type === 'opening_receivable'){
      debit = amt;
    } else if(t.type === 'opening_payable'){
      credit = amt;
    } else if(t.type === 'income'){
      debit = amt;
      credit = cashPaid;
    } else if(t.type === 'expense' || t.type === 'inventory_purchase'){
      credit = amt;
      debit = cashPaid;
    } else if(t.type === 'settle_payment'){
      debit = amt;
    } else if(t.type === 'settle_receipt'){
      credit = amt;
    } else if(t.type === 'loan_given'){
      debit = amt;   // به او قرض داده‌ایم => طلب ما
    } else if(t.type === 'loan_taken'){
      credit = amt;  // از او قرض گرفته‌ایم => بدهی ما
    }

    runningBalance += (debit - credit);
    entries.push({
      date: t.date,
      title: t.category + (t.note ? ' - ' + t.note : ''),
      typeTitle: TYPE_LABELS[t.type] || t.type,
      debit: debit,
      credit: credit,
      balance: runningBalance,
      rawTx: t
    });
  });
  return { entries: entries, finalBalance: runningBalance };
}

function getAllPersonsSummary(){
  var names = getUniquePersonNames();
  var res = [];
  names.forEach(function(n){
    var ledger = getPersonLedger(n);
    res.push({ name: n, balance: ledger.finalBalance, entriesCount: ledger.entries.length });
  });
  // اول حساب‌های دارای مانده (مثبت یا منفی)، بعد تسویه‌شده‌ها؛ هر دسته به ترتیب الفبا
  res.sort(function(a, b){
    var az = (Math.round(a.balance) === 0) ? 1 : 0;
    var bz = (Math.round(b.balance) === 0) ? 1 : 0;
    if(az !== bz) return az - bz;
    return a.name.localeCompare(b.name, 'fa');
  });
  return res;
}

function computeInventorySummary(){
  var totalVal = 0;
  var items = inventory.map(function(item){
    var val = (Number(item.qty)||0) * (Number(item.unitCost)||0);
    totalVal += val;
    return { id: item.id, name: item.name, qty: Number(item.qty)||0, unitCost: Number(item.unitCost)||0, totalCost: val };
  });
  return { items: items, totalVal: totalVal };
}

function computeJobProfit(jobId){
  var income = 0, expense = 0;
  transactions.forEach(function(t){
    if(t.jobId !== jobId) return;
    if(t.type === 'income') income += Number(t.amount)||0;
    if(t.type === 'expense' || t.type === 'inventory_usage') expense += Number(t.amount)||0;
  });
  return { income: income, expense: expense, profit: income - expense };
}

function loadData(){
  try {
    var raw = safeStorageGet(STORAGE_KEY);
    if(!raw) raw = safeStorageGet('tamirgah_db_v14_pure');
    if(raw){
      var d = JSON.parse(raw);
      applyImportData(d);
      if(!safeStorageGet(STORAGE_KEY) && STORAGE_KEY !== 'tamirgah_db_v14_pure'){
        saveData();
      }
    }
  } catch(e){}
  if(safeStorageGet(REMINDER_KEY) === '1' && 'Notification' in window && Notification.permission === 'granted'){
    var last = safeStorageGet(BACKUP_META_KEY);
    var stale = !last || (Date.now() - Date.parse(last)) > 7 * 24 * 60 * 60 * 1000;
    if(stale){
      setTimeout(function(){
        try { new Notification('یادآوری پشتیبان', { body: 'بیش از یک هفته از آخرین پشتیبان گذشته. از منوی بیشتر → پشتیبان‌گیری استفاده کنید.' }); } catch(e){}
      }, 2000);
    }
  }
  render();
}

function saveData(){
  try {
    var d = buildExportPayload();
    delete d.exportedAt;
    safeStorageSet(STORAGE_KEY, JSON.stringify(d));
  } catch(e){}
}

function txMatchesSearch(t, q){
  if(!q) return false;
  var job = t.jobId ? jobs.find(function(j){ return j.id === t.jobId; }) : null;

    t.category, t.person, t.note, String(t.amount),
    TYPE_LABELS[t.type] || t.type,
    job ? job.plate : '', job ? job.carModel : '', job ? job.customer : ''
  ].join(' ');
  return blob.indexOf(q) >= 0;
}

    var sign = isInc ? '+' : '−';
    var cls = (isTrans || isLoan) ? 'transfer' : (isInc ? 'income' : (t.type==='withdrawal' ? 'withdrawal' : 'expense'));
    var job = t.jobId ? jobs.find(function(j){ return j.id === t.jobId; }) : null;
    var accObj = t.accountId ? accounts.find(function(a){ return a.id === t.accountId; }) : null;
    var amt = Number(t.amount) || 0;
    var isCredit = (t.paymentStatus === 'credit');
    var isSplit = (t.paymentStatus === 'split');

    return '<div class="tx-item">' +
      '<div class="tx-main">' +
        '<div class="tx-cat">' + esc(t.category) + '</div>' +
        '<div class="tx-meta">' +
          faDate(t.date) + ' · ' + esc(TYPE_LABELS[t.type] || t.type) + (t.person ? ' · <b>' + esc(t.person) + '</b>' : '') +
          (accObj ? ' · <i>' + esc(accObj.name) + '</i>' : '') +
          (job ? ' · خودرو: ' + esc(job.carModel) : '') +
          (t.note ? ' · (' + esc(t.note) + ')' : '') +
        '</div>' +
        '<div class="tx-meta" style="margin-top:3px;">' +
          (isLoan ? '<span class="tag split">' + (t.type==='loan_given' ? 'قرض دستی داده‌شده' : 'قرض دستی گرفته‌شده') + ' (مانده در کاردکس شخص)</span>' :
          isSplit ? '<span class="tag split">تسویه ترکیبی (نقد: ' + fmt(t.paidAmount) + ' | نسیه: ' + fmt(amt - Number(t.paidAmount||0)) + ')</span>' :
          (isCredit ? '<span class="tag unpaid">ثبت کاملاً نسیه</span>' : '<span class="tag paid">نقدی / تسویه‌شده</span>')) +
        '</div>' +
      '</div>' +
      '<div class="actions" style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">' +
        '<div class="tx-amount ' + cls + '">' + sign + fmt(amt) + '</div>' +
        '<div style="display:flex;gap:4px;">' +
          (!isTrans ? '<button class="btn btn-sm btn-outline" data-edit-tx="' + t.id + '">ویرایش</button>' : '') +
          '<button class="btn btn-sm btn-outline" data-del="' + t.id + '" style="color:var(--red-danger);">حذف</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  var folderListHtml = pastDates.length === 0 ? '<div class="empty">هیچ پوشه یا روز گذشته‌ای وجود ندارد</div>' : pastDates.map(function(dt){

    return '<div class="day-folder" data-open-date="' + dt + '">' +
      '<span>📁 پوشه اسناد: <b>' + faDate(dt) + '</b> (' + count + ' سند)</span>' +
      '<button class="btn btn-sm btn-outline">مشاهده اسناد ❯</button>' +
    '</div>';
  }).join('');

  return '<div class="card">' +
    '<h2>جستجو در همه اسناد</h2>' +
    '<form id="journalGlobalSearchForm">' +
      '<label>نام مشتری، پلاک، مبلغ یا شرح</label>' +
      '<input type="search" id="journalSearchInput" name="q" value="' + escAttr(q) + '" placeholder="مثلاً پژو یا ۵۰۰۰۰۰..." autocomplete="off">' +
      '<button type="submit" class="btn btn-primary">جستجو</button>' +
    '</form>' +
  '</div>' +
  searchResultsHtml +
  '<div class="card">' +
    '<h2>جستجوی دستی و رجوع به تاریخ گذشته</h2>' +
    '<form id="journalDateSearchForm">' +
      '<label>انتخاب تاریخ مورد نظر برای باز کردن دفتر:</label>' +
      jalaliDateField('searchJDate', activeDate) +
      '<div style="display:flex;gap:6px;margin-top:6px;">' +
        '<button type="submit" class="btn btn-primary">بازگشایی دفتر این تاریخ</button>' +
        (!isToday ? '<button type="button" class="btn btn-dark" id="backToTodayJournalBtn">بازگشت به دفتر امروز</button>' : '') +
      '</div>' +
    '</form>' +
  '</div>' +

  '<div class="card">' +
    '<h2>' +
      '<span>دفتر روزنامه ' + (isToday ? 'امروز' : 'مورخ') + ' (' + faDate(activeDate) + ')</span>' +
      '<span class="tag ' + (isToday?'paid':'unpaid') + '">' + dayTx.length + ' معامله</span>' +

  '<div class="card">' +
    '<h2>بایگانی پوشه‌ای روزهای گذشته</h2>' +
    folderListHtml +
  '</div>';
}

function renderPersons(){
  var persons = getAllPersonsSummary();
  if(selectedPersonDetails){
    var ledger = getPersonLedger(selectedPersonDetails);
    var pTitle = selectedPersonDetails;
    var fBal = ledger.finalBalance;
    var statusText = fBal > 0 ? ('طلب ما: ' + fmt(fBal)) : (fBal < 0 ? ('بدهی ما به ایشان: ' + fmt(Math.abs(fBal))) : 'حساب کاملاً بی‌حساب است');
    var statusColor = fBal > 0 ? '#1E8449' : (fBal < 0 ? 'var(--red-danger)' : 'var(--ink)');

    var rowsHtml = ledger.entries.map(function(e){
      var balStr = e.balance > 0 ? ('+' + fmt(e.balance)) : (e.balance < 0 ? ('−' + fmt(Math.abs(e.balance))) : '۰');
      return '<tr>' +
        '<td>' + faDate(e.date) + '</td>' +
        '<td><b>' + e.title + '</b><br><small style="color:var(--ink-soft);">' + e.typeTitle + '</small></td>' +
        '<td style="color:#1E8449;">' + (e.debit > 0 ? fmt(e.debit) : '-') + '</td>' +
        '<td style="color:var(--red-danger);">' + (e.credit > 0 ? fmt(e.credit) : '-') + '</td>' +
        '<td style="font-weight:700;">' + balStr + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">' +
        '<button class="btn btn-sm btn-outline" id="backToPersonsBtn">❮ بازگشت به اشخاص</button>' +
        '<div style="display:flex;gap:5px;">' +
          '<button class="btn btn-sm btn-excel" id="exportPersonExcelBtn">📥 خروجی اکسل کاردکس</button>' +
          (fBal !== 0 ? '<button class="btn btn-sm btn-primary" data-direct-settle-person="' + escAttr(pTitle) + '">' + (fBal < 0 ? 'پرداخت بدهی' : 'وصول طلب') + '</button>' : '') +
        '</div>' +
      '</div>' +
      '<h2 style="margin-bottom:4px;">کاردکس حساب: ' + pTitle + '</h2>' +
      '<div style="font-size:14px;font-weight:700;color:' + statusColor + ';margin-bottom:12px;">وضعیت مانده نهایی: ' + statusText + '</div>' +
      '<div style="overflow-x:auto;">' +
        '<table class="tx-table">' +
          '<thead><tr><th>تاریخ</th><th>شرح سند</th><th>بدهکار (+)</th><th>بستانکار (−)</th><th>مانده لحظه‌ای</th></tr></thead>' +
          '<tbody>' + (rowsHtml || '<tr><td colspan="5" class="empty">هیچ تراکنشی ثبت نشده است</td></tr>') + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
  }

  var listHtml = persons.length === 0 ? '<div class="empty">هیچ شخص یا طرف‌حسابی ثبت نشده است</div>' : persons.map(function(p, idx){
    var isSettled = (Math.round(p.balance) === 0);
    var secHead = '';
    if(!isSettled && idx === 0) secHead = '<div style="font-weight:700;font-size:12.5px;color:var(--green-primary);margin:2px 0 8px;">حساب‌های دارای مانده (بدهکار / بستانکار)</div>';
    if(isSettled && (idx === 0 || Math.round(persons[idx-1].balance) !== 0)) secHead = '<div style="font-weight:700;font-size:12.5px;color:var(--ink-soft);margin:14px 0 8px;">حساب‌های تسویه‌شده</div>';
    var balColor = p.balance > 0 ? '#1E8449' : (p.balance < 0 ? 'var(--red-danger)' : 'var(--ink-soft)');
    var balText = p.balance > 0 ? ('طلب ما: ' + fmt(p.balance)) : (p.balance < 0 ? ('بدهی ما: ' + fmt(Math.abs(p.balance))) : 'تسویه کامل');
    return secHead + '<div class="person-box">' +
      '<div class="person-header"><span class="person-title">👤 ' + p.name + '</span><span style="font-weight:800;color:' + balColor + ';">' + balText + '</span></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:6px;">' +
        '<span style="font-size:11.5px;color:var(--ink-soft);">' + p.entriesCount + ' معامله</span>' +
        '<div style="display:flex;gap:5px;">' +
          (p.balance !== 0 ? '<button class="btn btn-sm btn-primary" data-direct-settle-person="' + escAttr(p.name) + '">' + (p.balance < 0 ? 'پرداخت بدهی' : 'وصول طلب') + '</button>' : '') +
          '<button class="btn btn-sm btn-outline" data-view-person="' + p.name + '">مشاهده کاردکس ❯</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="card">' +
    '<h2>کاردکس و اشخاص (ابتدا حساب‌های دارای مانده)</h2>' +
    listHtml +
  '</div>';
}

function renderDashboard(){
  var accBalances = computeAccountBalances();
  var totalCash = 0;
  var quickHtml = '<div class="quick-actions">' +
    '<button type="button" class="btn btn-income btn-lg" id="quickIncomeBtn">+ درآمد / اجرت</button>' +
    '<button type="button" class="btn btn-expense btn-lg" id="quickExpenseBtn">− هزینه</button>' +
  '</div>';

  var sortedAccounts = accounts.slice().sort(function(a, b){
    return (accBalances[b.id] || 0) - (accBalances[a.id] || 0);
  });

  var accRowsHtml = sortedAccounts.map(function(acc){
    var bal = accBalances[acc.id] || 0;
    totalCash += bal;
    return '<div class="stat clickable primary" data-open-acc-stmt="' + acc.id + '">' +
      '<div class="label">' + acc.name + ' 🔍</div>' +
      '<div class="value">' + fmt(bal) + '</div>' +
    '</div>';
  }).join('');

  var t = computeTotals(transactions);

  var pSummary = getAllPersonsSummary();
  var totalOwe = 0, totalOwed = 0;
  pSummary.forEach(function(p){
    if(p.balance > 0) totalOwed += p.balance;
    else if(p.balance < 0) totalOwe += Math.abs(p.balance);
  });

function showWithdrawalDetailsModal(){
  function esc(v){
    return String(v === undefined || v === null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var list = transactions.filter(function(t){ return t.type === 'withdrawal'; })
    .sort(function(a,b){

  var total = 0;

  var summaryHtml = '<div style="font-weight:700;font-size:12.5px;color:var(--green-primary);margin-bottom:4px;">خلاصه به تفکیک عنوان</div>' +

    '</table>';

  // ریز کامل تک‌تک برداشت‌ها
  var itemsHtml = list.map(function(t, i){
    var amt = Number(t.amount) || 0;
    var acc = t.accountId ? accounts.find(function(a){ return a.id === t.accountId; }) : null;
    var job = t.jobId ? jobs.find(function(j){ return j.id === t.jobId; }) : null;

      : (isCredit ? '<span class="tag unpaid">ثبت کاملاً نسیه</span>' : '<span class="tag paid">نقدی / تسویه‌شده</span>');

    return '<div class="tx-item" style="flex-direction:column;align-items:stretch;gap:4px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
        '<div class="tx-cat">' + faDigits(i+1) + '. ' + esc(t.category) + '</div>' +
        '<div class="tx-amount withdrawal">−' + fmt(amt) + '</div>' +
      '</div>' +
      '<div class="tx-meta">📅 تاریخ: <b>' + faDate(t.date) + '</b>' +
        (t.person ? ' · 👤 طرف حساب: <b>' + esc(t.person) + '</b>' : '') +
        (acc ? ' · 🏦 از حساب: <b>' + esc(acc.name) + '</b>' : '') +
        (job ? ' · 🚗 خودرو: ' + esc(job.carModel) : '') +
      '</div>' +
      '<div class="tx-meta" style="color:var(--ink);background:#FAFBFE;border:1px dashed var(--border);border-radius:6px;padding:5px 8px;">' +
        '📝 شرح: ' + (t.note ? esc(t.note) : '<span style="color:var(--ink-soft);">— بدون شرح —</span>') +
      '</div>' +

    (itemsHtml || '<div class="empty">برداشتی ثبت نشده است</div>');

  openModal('ریز برداشت شرکا و صاحبان مغازه', html);

function renderPnL(){
  var to = pnlTo || todayStr();
  var from = pnlFrom || (function(){ var d = new Date(); d.setDate(d.getDate()-30); return d.toISOString().slice(0,10); })();
  var revServices = 0, revParts = 0, otherIncome = 0, cogs = 0, expRent = 0, expSalary = 0, expShop = 0, expBills = 0, expOther = 0;

  transactions.filter(function(t){ return t.date >= from && t.date <= to; }).forEach(function(t){
    var amt = Number(t.amount) || 0;
    if(t.type === 'income'){
      if(t.category === 'اجرت خدمات') revServices += amt;
      else if(t.category === 'فروش قطعه') revParts += amt;
      else otherIncome += amt;
    } else if(t.type === 'expense' || t.type === 'inventory_usage'){
      if(t.category === 'قطعه مصرفی خودرو' || t.type === 'inventory_usage' || t.category === 'روغن و روانکار' || t.category === 'خدمات تراشکاری/همکاران') cogs += amt;
      else if(t.category === 'اجاره مغازه') expRent += amt;
      else if(t.category === 'دستمزد شاگرد/نیرو') expSalary += amt;
      else if(t.category === 'ملزومات مصرفی مغازه (هزینه جاری)' || t.category === 'پیک و باربری') expShop += amt;
      else if(t.category === 'قبوض مغازه') expBills += amt;
      else if(t.category !== 'خرید دارایی و ابزارآلات (استهلاک‌پذیر)') expOther += amt;
    }
  });

  var totalRevenue = revServices + revParts + otherIncome;
  var grossProfit = totalRevenue - cogs;
  var totalOperatingExpenses = expRent + expSalary + expShop + expBills + expOther + Number(pnlDeprAmt||0);
  var netIncome = grossProfit - totalOperatingExpenses;

  return '<div class="card">' +
    '<h2>فیلتر دوره صورت سود و زیان (P&L)</h2>' +
    '<form id="pnlFilterForm">' +
      '<div class="row"><div><label>از تاریخ</label>' + jalaliDateField('pnlFrom', from) + '</div><div><label>تا تاریخ</label>' + jalaliDateField('pnlTo', to) + '</div></div>' +
      '<label style="margin-top:6px;">هزینه استهلاک ابزارآلات این دوره (ریال)</label>' +
      '<input type="text" inputmode="numeric" class="money-input" name="pnlDepr" value="' + (pnlDeprAmt ? pnlDeprAmt.toLocaleString('en-US') : '') + '" placeholder="مبلغ استهلاک...">' +
      '<button type="submit" class="btn btn-primary" style="margin-top:4px;">محاسبه صورت سود و زیان</button>' +
    '</form>' +
  '</div>' +
  '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;">' +
      '<h2 style="border:none;margin:0;padding:0;">صورت عملکرد مالی (' + faDate(from) + ' تا ' + faDate(to) + ')</h2>' +
      '<button class="btn btn-sm btn-excel" id="exportPnLExcelBtn">📥 خروجی اکسل سود و زیان</button>' +
    '</div>' +
    '<table class="tx-table">' +
      '<tbody>' +
        '<tr style="background:#f9f9f9;"><td colspan="2"><b>۱. درآمدهای عملیاتی</b></td></tr>' +
        '<tr><td>درآمد خدمات و اجرت</td><td style="color:#1E8449;">' + fmt(revServices) + '</td></tr>' +
        '<tr><td>فروش قطعات</td><td style="color:#1E8449;">' + fmt(revParts) + '</td></tr>' +
        '<tr><td>سایر دریافت‌ها</td><td style="color:#1E8449;">' + fmt(otherIncome) + '</td></tr>' +
        '<tr style="font-weight:700;"><td>مجموع درآمد ناخالص</td><td>' + fmt(totalRevenue) + '</td></tr>' +
        '<tr style="background:#f9f9f9;"><td colspan="2"><b>۲. بهای تمام‌شده قطعات (COGS)</b></td></tr>' +
        '<tr><td>قطعات مصرفی و روغن</td><td style="color:var(--red-danger);">' + fmt(cogs) + '</td></tr>' +
        '<tr style="font-weight:800;background:var(--green-soft);"><td>سود ناخالص عملیاتی</td><td style="color:' + (grossProfit>=0?'#1E8449':'var(--red-danger)') + '">' + fmt(grossProfit) + '</td></tr>' +
        '<tr style="background:#f9f9f9;"><td colspan="2"><b>۳. هزینه‌های جاری و استهلاک مغازه</b></td></tr>' +
        '<tr><td>اجاره ملک</td><td>' + fmt(expRent) + '</td></tr>' +
        '<tr><td>حقوق و دستمزد پرسنل</td><td>' + fmt(expSalary) + '</td></tr>' +
        '<tr><td>قبوض آب، برق و گاز</td><td>' + fmt(expBills) + '</td></tr>' +
        '<tr><td>ملزومات مصرفی و پیک</td><td>' + fmt(expShop) + '</td></tr>' +
        '<tr><td>استهلاک ابزارآلات و تجهیزات</td><td style="color:var(--red-danger);">' + fmt(pnlDeprAmt) + '</td></tr>' +
        '<tr><td>سایر هزینه‌های متفرقه</td><td>' + fmt(expOther) + '</td></tr>' +
        '<tr style="font-weight:700;"><td>مجموع هزینه‌های جاری و استهلاک</td><td>' + fmt(totalOperatingExpenses) + '</td></tr>' +
        '<tr style="font-weight:900;font-size:14.5px;background:' + (netIncome>=0?'var(--green-soft)':'var(--red-soft)') + ';">' +
          '<td>سود خالص نهایی دوره</td><td style="color:' + (netIncome>=0?'#1E8449':'var(--red-danger)') + '">' + fmt(netIncome) + '</td>' +
        '</tr>' +
      '</tbody>' +
    '</table>' +
  '</div>';
}

  document.querySelectorAll('.money-input').forEach(function(el){
    // جداکننده سه‌رقمی هنگام تایپ (کاما) با حفظ جای مکان‌نما
    el.setAttribute('autocomplete', 'off');
    el.addEventListener('input', function(){
      var val = el.value;
      var caret = el.selectionStart;
      var digitsLeft = val.slice(0, caret === null ? val.length : caret).replace(/[^0-9۰-۹٠-٩]/g, '').length;
      var n = parseMoney(val);
      var out = n > 0 ? n.toLocaleString('en-US') : '';
      if(out === val) return;
      el.value = out;
      var p = 0, c = 0;
      while(p < out.length && c < digitsLeft){
        if(/[0-9]/.test(out.charAt(p))) c++;
        p++;
      }
      try { el.setSelectionRange(p, p); } catch(err){}
    });
    // اگر مقدار اولیه (مثلاً در ویرایش) بدون کاما بود، فرمت شود
    var initN = parseMoney(el.value);
    if(initN > 0) el.value = initN.toLocaleString('en-US');
  });

  document.querySelectorAll('.jdate-group').forEach(function(group){
    var hidden = group.querySelector('input[type=hidden]');
    var daySel = group.querySelector('.jd-day');
    var monthSel = group.querySelector('.jd-month');
    var yearSel = group.querySelector('.jd-year');
    function sync(){
      var jy = Number(yearSel.value), jm = Number(monthSel.value), jd = Number(daySel.value);
      hidden.value = jalaliToISO(jy, jm, jd);
    }
    daySel.onchange = sync; monthSel.onchange = sync; yearSel.onchange = sync;
  });

    el.onclick = function(){

  // انتقال وجه بین حساب‌های داخلی (نقدینگی)
  var trForm = document.getElementById('transferAccForm');
  if(trForm){
    trForm.onsubmit = function(e){
      e.preventDefault();
      var fd = new FormData(trForm);
      var fromId = fd.get('fromAccId');
      var toId = fd.get('toAccId');
      var amt = parseMoney(fd.get('transferAmount'));
      var dt = fd.get('transferDate') || todayStr();
      var note = (fd.get('transferNote') || '').trim();

      if(fromId === toId){
        alert('حساب مبدأ و مقصد نمی‌تواند یکسان باشد!');
        return;
      }
      if(amt <= 0){
        alert('مبلغ انتقال نامعتبر است.');
        return;
      }

      var fromAcc = accounts.find(function(a){ return a.id === fromId; });
      var toAcc = accounts.find(function(a){ return a.id === toId; });

      var linkId = 'tr_' + Date.now();

      // تراکنش خروج از حساب مبدأ
      transactions.push({
        id: 'tx_out_' + Date.now(),
        transferLinkId: linkId,
        type: 'transfer_out',
        date: dt,
        category: 'انتقال داخلی به ' + toAcc.name,
        person: 'انتقال بین‌بانکی',
        amount: amt,
        paidAmount: amt,
        paymentStatus: 'full',
        accountId: fromId,
        jobId: null,
        note: (note ? note + ' - ' : '') + 'انتقال به ' + toAcc.name
      });

      // تراکنش ورود به حساب مقصد
      transactions.push({
        id: 'tx_in_' + (Date.now() + 1),
        transferLinkId: linkId,
        type: 'transfer_in',
        date: dt,
        category: 'انتقال داخلی از ' + fromAcc.name,

        paymentStatus: 'full',
        accountId: toId,
        jobId: null,
        note: (note ? note + ' - ' : '') + 'دریافت از ' + fromAcc.name
      });

      saveData();
      alert('انتقال مبلغ ' + fmt(amt) + ' از [' + fromAcc.name + '] به [' + toAcc.name + '] با موفقیت ثبت شد.');

      }
      if(statusPay === 'credit'){ accId = null; paidAmt = 0; }
      if(statusPay === 'full'){ paidAmt = amt; }

      var txData = {
        id: editId ? editId : ('tx_' + Date.now()),
        type: editId ? (transactions.find(function(x){return x.id===editId;})||{}).type : formType,
        date: fd.get('date') || todayStr(),

      var targetTx = transactions.find(function(x){ return x.id === b.dataset.del; });
      var snapshot;
      if(targetTx && targetTx.transferLinkId){
        snapshot = transactions.filter(function(x){ return x.transferLinkId === targetTx.transferLinkId; });
        transactions = transactions.filter(function(x){ return x.transferLinkId !== targetTx.transferLinkId; });
      } else {
        snapshot = transactions.filter(function(x){ return x.id === b.dataset.del; });
        transactions = transactions.filter(function(x){ return x.id !== b.dataset.del; });
      }
      lastUndoDelete = snapshot;
      clearTimeout(undoDeleteTimer);
      saveData();
      render();
      showToast('سند حذف شد.', function(){
        if(lastUndoDelete && lastUndoDelete.length){
          transactions = transactions.concat(lastUndoDelete);
          lastUndoDelete = null;
          saveData();
          render();
          showToast('سند بازگردانی شد.');
        }
      });
      undoDeleteTimer = setTimeout(function(){ lastUndoDelete = null; }, 8000);
    };
  });

  // Export Person Excel
  var exPersonBtn = document.getElementById('exportPersonExcelBtn');
  if(exPersonBtn){
    exPersonBtn.onclick = function(){
      var ledger = getPersonLedger(selectedPersonDetails);
      var rows = [
        ['صورت‌حساب و کاردکس شخص', selectedPersonDetails],
        ['تاریخ استخراج', faDate(todayStr())],
        ['مانده نهایی (ریال)', ledger.finalBalance],
        ['وضعیت مانده', ledger.finalBalance > 0 ? 'طلبکار هستیم' : (ledger.finalBalance < 0 ? 'بدهکار هستیم' : 'تسویه')],
        [],
        ['ردیف', 'تاریخ', 'شرح رویداد / سند', 'نوع معامله', 'بدهکار (ریال)', 'بستانکار (ریال)', 'مانده لحظه‌ای (ریال)']
      ];
      ledger.entries.forEach(function(e, i){
        rows.push([i+1, faDate(e.date), e.title, e.typeTitle, e.debit, e.credit, e.balance]);
      });
      exportToExcelCSV('Kardex_' + selectedPersonDetails + '.csv', rows);
    };
  }

  // Export Job Excel
  var exJobBtn = document.getElementById('exportJobExcelBtn');
  if(exJobBtn){
    exJobBtn.onclick = function(){
      var j = jobs.find(function(x){ return x.id === selectedJobDetails; });
      if(!j) return;
      var p = computeJobProfit(j.id);
      var jTx = transactions.filter(function(t){ return t.jobId === j.id; })
                            .sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });

      var rows = [
        ['شناسنامه خودرو', j.carModel],
        ['شماره پلاک', j.plate || '-'],
        ['مالک خودرو', j.customer],
        ['کیلومتر', j.km || '-'],
        ['ایراد', j.complaint || '-'],
        ['تاریخ پذیرش', faDate(j.createdDate)],
        ['درآمد کل فاکتورها (ریال)', p.income],
        ['هزینه کل قطعات (ریال)', p.expense],
        ['سود و اجرت خالص (ریال)', p.profit],
        [],
        ['ردیف', 'تاریخ', 'شرح رویداد / قطعه', 'توضیحات', 'درآمد خدمات (ریال)', 'هزینه قطعه (ریال)']
      ];

      jTx.forEach(function(t, i){
        rows.push([
          i+1,
          faDate(t.date),
          t.category,
          t.note || '',
          t.type === 'income' ? t.amount : 0,
          (t.type==='expense'||t.type==='inventory_usage') ? t.amount : 0
        ]);
      });

      exportToExcelCSV('Car_' + (j.plate || j.carModel) + '.csv', rows);
    };
  }

  // Export PnL Excel
  var exPnLBtn = document.getElementById('exportPnLExcelBtn');
  if(exPnLBtn){
    exPnLBtn.onclick = function(){
      var to = pnlTo || todayStr();
      var from = pnlFrom || (function(){ var d = new Date(); d.setDate(d.getDate()-30); return d.toISOString().slice(0,10); })();
      var revServices = 0, revParts = 0, otherIncome = 0, cogs = 0, expRent = 0, expSalary = 0, expShop = 0, expBills = 0, expOther = 0;

      transactions.filter(function(t){ return t.date >= from && t.date <= to; }).forEach(function(t){
        var amt = Number(t.amount) || 0;
        if(t.type === 'income'){
          if(t.category === 'اجرت خدمات') revServices += amt;
          else if(t.category === 'فروش قطعه') revParts += amt;
          else otherIncome += amt;
        } else if(t.type === 'expense' || t.type === 'inventory_usage'){
          if(t.category === 'قطعه مصرفی خودرو' || t.type === 'inventory_usage' || t.category === 'روغن و روانکار' || t.category === 'خدمات تراشکاری/همکاران') cogs += amt;
          else if(t.category === 'اجاره مغازه') expRent += amt;
          else if(t.category === 'دستمزد شاگرد/نیرو') expSalary += amt;
          else if(t.category === 'ملزومات مصرفی مغازه (هزینه جاری)' || t.category === 'پیک و باربری') expShop += amt;
          else if(t.category === 'قبوض مغازه') expBills += amt;
          else if(t.category !== 'خرید دارایی و ابزارآلات (استهلاک‌پذیر)') expOther += amt;
        }
      });

      var totalRevenue = revServices + revParts + otherIncome;
      var grossProfit = totalRevenue - cogs;
      var totalOperatingExpenses = expRent + expSalary + expShop + expBills + expOther + Number(pnlDeprAmt||0);
      var netIncome = grossProfit - totalOperatingExpenses;

      var rows = [
        ['صورت سود و زیان تعمیرگاه'],
        ['از تاریخ', faDate(from)],
        ['تا تاریخ', faDate(to)],
        [],
        ['سرفصل عملکرد مالی', 'مبلغ به ریال'],
        ['۱. درآمد خدمات و اجرت', revServices],
        ['فروش قطعات', revParts],
        ['سایر دریافت‌ها', otherIncome],
        ['جمع کل درآمدهای ناخالص', totalRevenue],
        ['۲. بهای تمام‌شده قطعات مصرفی (COGS)', cogs],
        ['سود ناخالص عملیاتی', grossProfit],
        ['۳. هزینه‌های جاری و استهلاک', ''],
        ['اجاره مغازه', expRent],
        ['حقوق و دستمزد', expSalary],
        ['قبوض مغازه', expBills],
        ['ملزومات مصرفی و پیک', expShop],
        ['استهلاک ابزارآلات و تجهیزات', Number(pnlDeprAmt||0)],
        ['سایر هزینه‌های متفرقه', expOther],
        ['مجموع هزینه‌های جاری و استهلاک', totalOperatingExpenses],
        ['سود خالص نهایی دوره', netIncome]
      ];

      exportToExcelCSV('PnL_Report_' + faDate(from).replace(/\//g,'-') + '_to_' + faDate(to).replace(/\//g,'-') + '.csv', rows);
    };
  }

  // Backup & Restore
  var downloadBackupBtn = document.getElementById('downloadBackupBtn');
  if(downloadBackupBtn){
    downloadBackupBtn.onclick = function(){
      try {
        runBackupExport({ tryShare: false });
        showToast('فایل پشتیبان دانلود شد. پوشهٔ Downloads را بررسی کنید.');
        render();
      } catch(err){
        showBackupJsonPreview = true;
        alert('خطا در ساخت فایل: ' + (err.message || err) + '\nمتن JSON در صفحه نمایش داده می‌شود؛ آن را کپی کنید.');
        render();
      }
    };
  }

  var shareBackupBtn = document.getElementById('shareBackupBtn');
  if(shareBackupBtn){
    shareBackupBtn.onclick = function(){
      try {
        runBackupExport({ tryShare: true });
        showToast('فایل دانلود شد. اگر منوی اشتراک باز شد، تلگرام یا Drive را انتخاب کنید.');
        render();
      } catch(err){
        showBackupJsonPreview = true;
        alert('خطا در پشتیبان: ' + (err.message || err));
        render();
      }
    };
  }

  var copyJsonBtn = document.getElementById('copyJsonBtn');
  if(copyJsonBtn){
    copyJsonBtn.onclick = function(){
      var dataStr;
      try { dataStr = stringifyBackupPayload(); } catch(err){ alert('خطا: ' + err.message); return; }
      markBackupDone();
      var done = function(){
        showToast('JSON در کلیپ‌بورد کپی شد.');
        render();
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(dataStr).then(done).catch(function(){
          var ta = document.getElementById('backupTextarea');
          if(ta){ ta.select(); document.execCommand('copy'); done(); }
          else { alert('کپی انجام نشد.'); }
        });
      } else {
        var ta = document.getElementById('backupTextarea');
        if(!ta){ showBackupJsonPreview = true; render(); return; }
        ta.select();
        document.execCommand('copy');
        done();
      }
    };
  }

  var restoreManualBtn = document.getElementById('restoreTextBtn');
  if(restoreManualBtn){
    restoreManualBtn.onclick = function(){
      var txt = document.getElementById('restoreManualText').value.trim();
      if(!txt){ alert('لطفاً ابتدا کد را وارد کنید.'); return; }
      try {
        var d = JSON.parse(txt);
        if(!confirm('اطلاعات فعلی با این نسخه جایگزین شود؟')) return;
        applyImportData(d);
        saveData();
        switchTab('dashboard');
        showToast('اطلاعات بازیابی شد.');
      } catch(e){ alert('کد وارد شده نامعتبر است.'); }
    };
  }

  var rFile = document.getElementById('restoreFileInput');
  if(rFile){
    rFile.onchange = function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        try {
          var d = JSON.parse(ev.target.result);
          if(!confirm('اطلاعات فعلی با این فایل جایگزین شود؟')) return;
          applyImportData(d);
          saveData();
          e.target.value = '';
          switchTab('dashboard');
          showToast('فایل پشتیبان بارگذاری شد.');
        } catch(err){ alert('فایل نامعتبر است.'); }
      };
      reader.readAsText(file);
    };
  }

  // Inventory Buy
  var buyInvForm = document.getElementById('buyInvForm');
  if(buyInvForm){
    buyInvForm.onsubmit = function(e){
      e.preventDefault();
      var fd = new FormData(buyInvForm);
      var name = fd.get('name').trim();
      var qty = Number(fd.get('qty'));
      var unitCost = parseMoney(fd.get('unitCost'));
      var payChannel = fd.get('payChannel');
      var person = fd.get('person').trim();

      var item = inventory.find(function(i){ return i.name.toLowerCase() === name.toLowerCase(); });
      if(item){
        var totalQ = item.qty + qty;
        item.unitCost = totalQ > 0 ? Math.round(((item.qty * item.unitCost) + (qty * unitCost)) / totalQ) : unitCost;
        item.qty = totalQ;
      } else {
        inventory.push({ id: 'inv_' + Date.now(), name: name, qty: qty, unitCost: unitCost });
      }

      var isCredit = (payChannel === 'credit');
      var totalAmount = qty * unitCost;

      transactions.push({
        id: 'tx_' + Date.now(),
        type: 'inventory_purchase',
        date: todayStr(),
        category: 'خرید انبار: ' + name,
        person: person,
        amount: totalAmount,
        paymentStatus: isCredit ? 'credit' : 'full',
        accountId: isCredit ? null : payChannel,
        note: 'خرید ' + qty + ' عدد به فی ' + fmt(unitCost),
        jobId: null
      });
      saveData();
      alert('قطعه به انبار افزوده شد' + (isCredit ? ' و بدهی در کاردکس ' + person + ' ثبت شد.' : '.'));
      switchTab('inventory');
    };
  }

  var useInvForm = document.getElementById('useInvForm');
  if(useInvForm){
    useInvForm.onsubmit = function(e){
      e.preventDefault();
      var fd = new FormData(useInvForm);
      var item = inventory.find(function(i){ return i.id === fd.get('itemId'); });
      var qty = Number(fd.get('qty'));
      if(!item || qty > item.qty){ alert('موجودی انبار کافی نیست!'); return; }
      item.qty -= qty;

      transactions.push({
        id: 'tx_' + Date.now(),
        type: 'inventory_usage',
        date: todayStr(),
        category: 'قطعه انبار: ' + item.name,
        person: '',
        amount: qty * item.unitCost,
        paymentStatus: 'full',
        accountId: null,
        note: 'مصرف ' + qty + ' عدد از انبار',
        jobId: fd.get('jobId') || null
      });
      saveData(); render();
    };
  }

  document.querySelectorAll('[data-direct-settle-person]').forEach(function(b){
    b.onclick = function(){
      openSettlePersonModal(b.dataset.directSettlePerson);
    };
  });

  // Jobs
  var jobForm = document.getElementById('newJobForm');
  if(jobForm){
    jobForm.onsubmit = function(e){
      e.preventDefault();
      var fd = new FormData(jobForm);
      jobs.push(normalizeJobRecord({
        id: 'job_' + Date.now(),
        carModel: fd.get('carModel').trim(),
        plate: fd.get('plate').trim(),
        customer: fd.get('customer').trim(),
        customerPhone: normalizeIranPhone(fd.get('customerPhone')),
        km: fd.get('km').trim(),
        complaint: fd.get('complaint').trim(),
        createdDate: todayStr(),
        status: 'open',
        smsOptOut: false,
        smsCampaigns: {}
      }));
      saveData(); render();
    };
  }

  document.querySelectorAll('[data-view-job]').forEach(function(b){
    b.onclick = function(){ selectedJobDetails = b.dataset.viewJob; render(); };
  });

  var backJobsBtn = document.getElementById('backToJobsListBtn');
  if(backJobsBtn){
    backJobsBtn.onclick = function(){ selectedJobDetails = ''; render(); };
  }

  document.querySelectorAll('[data-jobdone]').forEach(function(b){
    b.onclick = function(){
      var j = jobs.find(function(x){ return x.id === b.dataset.jobdone; });
      if(j && confirm('این خودرو ترخیص و به بایگانی سوابق منتقل شود؟')){
        j.status = 'done';
        j.deliveredDate = todayStr();
        if(!j.deliveryKm && j.km) j.deliveryKm = j.km;
        saveData();
        showToast('خودرو ترخیص شد. پس از ' + (ippanelSettings.daysAfterDelivery||90) + ' روز در صف پیامک پیشنهاد می‌شود.');
        render();
      }
    };
  });
  document.querySelectorAll('[data-jobreopen]').forEach(function(b){
    b.onclick = function(){
      var j = jobs.find(function(x){ return x.id === b.dataset.jobreopen; });
      if(j && confirm('پرونده این خودرو مجدداً بازگشایی شود؟')){ j.status = 'open'; saveData(); render(); }
    };
  });
  document.querySelectorAll('[data-jobdel]').forEach(function(b){
    b.onclick = function(){
      if(confirm('پرونده این خودرو برای همیشه حذف شود؟')){ jobs = jobs.filter(function(x){ return x.id !== b.dataset.jobdel; }); saveData(); render(); }
    };
  });

  // Accounts
  var newAccForm = document.getElementById('newAccForm');
  if(newAccForm){
    newAccForm.onsubmit = function(e){
      e.preventDefault();
      var fd = new FormData(newAccForm);
      accounts.push({ id: 'acc_' + Date.now(), name: fd.get('accName').trim(), initial: parseMoney(fd.get('accInitial')) });
      saveData(); render();
    };
  }

  // ویرایش همزمان نام حساب و مانده اول دوره
  document.querySelectorAll('[data-edit-acc-all]').forEach(function(b){
    b.onclick = function(){
      var acc = accounts.find(function(a){ return a.id === b.dataset.editAccAll; });
      if(!acc) return;
      var newName = prompt('نام جدید حساب / کارتخوان را وارد کنید:', acc.name);
      if(newName === null) return;
      newName = newName.trim();
      if(!newName) { alert('نام حساب نمی‌تواند خالی باشد.'); return; }

      var newInit = prompt('موجودی اول دوره جدید را وارد کنید (ریال):', acc.initial);
      if(newInit === null) return;

      acc.name = newName;
      acc.initial = parseMoney(newInit);
      saveData();
      render();
    };
  });

  // حذف حساب با بررسی و اعتبارسنجی تراکنش‌های وابسته
  document.querySelectorAll('[data-del-acc]').forEach(function(b){
    b.onclick = function(){
      var accId = b.dataset.delAcc;
      var acc = accounts.find(function(a){ return a.id === accId; });
      if(!acc) return;

      var relatedTxCount = transactions.filter(function(t){ return t.accountId === accId; }).length;
      if(relatedTxCount > 0){
        var confirmDel = confirm('توجه: برای این حساب (' + acc.name + ') تعداد ' + relatedTxCount + ' سند مالی ثبت شده است.\nحذف این حساب سوابق قبلی را از بین نمی‌برد، اما در گزارش‌ها به عنوان حساب حذف‌شده نشان داده خواهد شد.\nآیا از حذف حساب مطمئن هستید؟');
        if(!confirmDel) return;
      } else {
        if(!confirm('آیا از حذف حساب "' + acc.name + '" اطمینان دارید؟')) return;
      }

      accounts = accounts.filter(function(a){ return a.id !== accId; });
      saveData();
      render();
    };
  });

  // Persons
  document.querySelectorAll('[data-view-person]').forEach(function(b){
    b.onclick = function(){ selectedPersonDetails = b.dataset.viewPerson; render(); };
  });

  var backBtn = document.getElementById('backToPersonsBtn');
  if(backBtn){
    backBtn.onclick = function(){ selectedPersonDetails = ''; render(); };
  }

  var pnlForm = document.getElementById('pnlFilterForm');
  if(pnlForm){
    pnlForm.onsubmit = function(e){
      e.preventDefault();
      var fd = new FormData(pnlForm);
      pnlFrom = fd.get('pnlFrom');
      pnlTo = fd.get('pnlTo');
      pnlDeprAmt = parseMoney(fd.get('pnlDepr'));
      render();
    };
  }
}

// ناوبری با سوایپ (Swipe)
var touchStartX = 0;
var touchStartY = 0;
document.addEventListener('touchstart', function(e){
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener('touchend', function(e){
  var diffX = e.changedTouches[0].screenX - touchStartX;
  var diffY = e.changedTouches[0].screenY - touchStartY;
  if(Math.abs(diffX) > 75 && Math.abs(diffX) > Math.abs(diffY) * 1.8){
    var swipeTab = isSecondaryTab(activeTab) ? 'more' : activeTab;
    var curIdx = TAB_ORDER.indexOf(swipeTab);
    if(curIdx !== -1){
      if(diffX < 0 && curIdx < TAB_ORDER.length - 1){
        switchTab(TAB_ORDER[curIdx + 1]);
      } else if(diffX > 0 && curIdx > 0){
        switchTab(TAB_ORDER[curIdx - 1]);
      }
    }
  }
}, { passive: true });

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

loadData();
</script>
</body>
</html>
